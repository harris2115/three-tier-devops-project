
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API reverse proxy
    location /student {
        proxy_pass http://backend:3500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /teacher {
        proxy_pass http://backend:3500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /addstudent {
        proxy_pass http://backend:3500;
        proxy_set_header Host $host;
    }

    location /addteacher {
        proxy_pass http://backend:3500;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:3500;
    }

    # React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}

