<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<defs>
 <style>
 .title{font:700 34px Arial,sans-serif;fill:#fff}.h{font:700 25px Arial,sans-serif;fill:#172033}.t{font:20px Arial,sans-serif;fill:#263449}.small{font:17px Arial,sans-serif;fill:#34445b}.bold{font-weight:700}
 </style>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
</defs>
<rect width="1500" height="980" fill="url(#bg)"/>
<rect width="1500" height="82" fill="#172b45"/><text x="55" y="53" class="title">AWS Terraform Network Layout — Three-Tier DevOps Project</text>
<rect x="30" y="112" width="1010" height="820" rx="24" fill="#fff" stroke="#263e5b" stroke-width="3"/>
<text x="65" y="158" class="h">AWS Cloud</text>
<rect x="75" y="205" width="920" height="680" rx="22" fill="#f7f1ff" stroke="#7138d6" stroke-width="4"/>
<text x="110" y="250" class="h">VPC · 10.0.0.0/16</text>
<ellipse cx="550" cy="157" rx="110" ry="38" fill="#eaf4ff" stroke="#23558b" stroke-width="3"/><text x="550" y="165" text-anchor="middle" class="h">Internet</text>
<path d="M550 195 V270" stroke="#23558b" stroke-width="4" fill="none"/><path d="M540 257 L550 273 L560 257" fill="none" stroke="#23558b" stroke-width="4"/>
<rect x="445" y="270" width="210" height="62" rx="16" fill="#f0e9ff" stroke="#7138d6" stroke-width="3"/><text x="550" y="309" text-anchor="middle" class="t bold">Internet Gateway</text>
<path d="M550 332 V365 H320 V400" fill="none" stroke="#27834b" stroke-width="4"/>
<rect x="115" y="400" width="545" height="445" rx="20" fill="#eaf7ed" stroke="#27834b" stroke-width="3"/>
<text x="150" y="445" class="h">Public Subnet</text><text x="150" y="477" class="t">10.0.1.0/24</text>
<rect x="165" y="505" width="445" height="90" rx="14" fill="#fff7ed" stroke="#d97706" stroke-width="2" stroke-dasharray="9 6"/>
<text x="190" y="540" class="t bold">EC2 Security Group</text><text x="190" y="570" class="small">HTTP 80 · HTTPS 443 · SSH 22 (restricted source)</text>
<rect x="165" y="620" width="445" height="190" rx="18" fill="#fff0d9" stroke="#e67e22" stroke-width="3"/>
<text x="387" y="660" text-anchor="middle" class="h">Single EC2 Instance · Ubuntu</text><text x="387" y="690" text-anchor="middle" class="small">Public IP · Docker host</text>
<rect x="190" y="710" width="120" height="75" rx="12" fill="#fff" stroke="#3974bd" stroke-width="2"/><text x="250" y="740" text-anchor="middle" class="t bold">Frontend</text><text x="250" y="765" text-anchor="middle" class="small">React / Nginx</text>
<rect x="327" y="710" width="120" height="75" rx="12" fill="#fff" stroke="#3974bd" stroke-width="2"/><text x="387" y="740" text-anchor="middle" class="t bold">Backend</text><text x="387" y="765" text-anchor="middle" class="small">Node.js :3500</text>
<rect x="464" y="710" width="120" height="75" rx="12" fill="#fff" stroke="#3974bd" stroke-width="2"/><text x="524" y="740" text-anchor="middle" class="t bold">Database</text><text x="524" y="765" text-anchor="middle" class="small">MySQL</text>
<rect x="700" y="400" width="255" height="445" rx="20" fill="#e9f3ff" stroke="#2878bd" stroke-width="3"/>
<text x="735" y="445" class="h">Private Subnet</text><text x="735" y="477" class="t">10.0.2.0/24</text>
<rect x="730" y="550" width="195" height="190" rx="14" fill="#fff" stroke="#2878bd" stroke-width="2" stroke-dasharray="8 6"/>
<text x="827" y="600" text-anchor="middle" class="t bold">Reserved for</text><text x="827" y="632" text-anchor="middle" class="t">future private-tier</text><text x="827" y="664" text-anchor="middle" class="t">resources</text>
<rect x="1080" y="145" width="380" height="340" rx="20" fill="#fff" stroke="#6e8eb8" stroke-width="3"/>
<text x="1115" y="190" class="h">Terraform Resources</text>
<g class="t"><text x="1120" y="240">✓  VPC</text><text x="1120" y="280">✓  Public subnet</text><text x="1120" y="320">✓  Private subnet</text><text x="1120" y="360">✓  Internet Gateway</text><text x="1120" y="400">✓  Public route table</text><text x="1120" y="440">✓  Security Group + EC2</text></g>
<rect x="1080" y="525" width="380" height="350" rx="20" fill="#edf4ff" stroke="#6e8eb8" stroke-width="3"/>
<text x="1115" y="570" class="h">Deployment Notes</text>
<g class="small"><text x="1115" y="625">• One EC2 instance in the</text><text x="1135" y="652">public subnet.</text><text x="1115" y="700">• Frontend, backend and MySQL</text><text x="1135" y="727">run as Docker containers there.</text><text x="1115" y="775">• Private subnet is reserved</text><text x="1135" y="802">for future internal resources.</text><text x="1115" y="850">• Backend and DB are not</text><text x="1135" y="875">publicly exposed host ports.</text></g>
</svg>